name: voidnull-dev

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voidnull}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-voidnull_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voidnull} -d ${POSTGRES_DB:-voidnull_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Applications ────────────────────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-voidnull}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-voidnull_dev}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_min_32_chars_long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_min_32}
      JWT_2FA_SECRET: ${JWT_2FA_SECRET:-dev_2fa_secret_min_32_chars}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: development
      API_PORT: 3001
      WEB_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/api/src:/app/apps/api/src:ro
      - ../../prisma:/app/prisma:ro

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.dev
    environment:
      NEXT_PUBLIC_WS_URL: http://localhost:3001
      API_INTERNAL_URL: http://api:3001/api
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ../../apps/web/src:/app/apps/web/src:ro
      - ../../apps/web/public:/app/public
      - ../../apps/web/tailwind.config.ts:/app/apps/web/tailwind.config.ts:ro
      - ../../apps/web/postcss.config.js:/app/apps/web/postcss.config.js:ro
      - ../../apps/web/next.config.mjs:/app/apps/web/next.config.mjs:ro

  # ── DB Migration on startup ─────────────────────────────────────────────────
  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.dev
    command: sh -c "npx prisma migrate deploy"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-voidnull}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-voidnull_dev}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  redis_data:
