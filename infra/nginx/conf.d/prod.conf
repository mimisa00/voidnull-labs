# Production — voidnull.io + voidnull.ai with Let's Encrypt
upstream api_prod { server api:3001; }
upstream web_prod { server web:3000; }

# HTTP → HTTPS redirect for all domains
server {
    listen 80;
    server_name voidnull.io www.voidnull.io voidnull.ai www.voidnull.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# www redirect → apex
server {
    listen 443 ssl;
    http2 on;
    server_name www.voidnull.io www.voidnull.ai;

    ssl_certificate     /etc/letsencrypt/live/voidnull.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voidnull.io/privkey.pem;

    return 301 https://voidnull.io$request_uri;
}

# voidnull.ai → voidnull.io (canonical)
server {
    listen 443 ssl;
    http2 on;
    server_name voidnull.ai;

    ssl_certificate     /etc/letsencrypt/live/voidnull.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voidnull.ai/privkey.pem;

    return 301 https://voidnull.io$request_uri;
}

# Main production server
server {
    listen 443 ssl;
    http2 on;
    server_name voidnull.io;

    ssl_certificate     /etc/letsencrypt/live/voidnull.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voidnull.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    client_max_body_size 20M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        proxy_pass http://web_prod;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://api_prod/api/;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    location /socket.io/ {
        proxy_pass http://api_prod/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://web_prod;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
