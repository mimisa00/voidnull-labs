input {
  # Accept JSON logs from NestJS via TCP
  tcp {
    port => 5000
    codec => json_lines
  }

  # Accept Filebeat/Docker logs
  beats {
    port => 5044
  }
}

filter {
  # Parse NestJS log format
  if [type] == "api" {
    mutate {
      add_field => { "service" => "voidnull-api" }
    }

    # Extract log level
    if [level] {
      mutate { lowercase => ["level"] }
    }
  }

  if [type] == "nginx" {
    grok {
      match => {
        "message" => '%{IPORHOST:remote_ip} - %{DATA:user_name} \[%{HTTPDATE:access_time}\] \"%{WORD:http_method} %{DATA:url} HTTP/%{NUMBER:http_version}\" %{NUMBER:response_code} %{NUMBER:body_sent_bytes} \"%{DATA:referrer}\" \"%{DATA:agent}\"'
      }
    }
    mutate {
      add_field => { "service" => "nginx" }
      convert => { "response_code" => "integer" }
    }
  }

  # Add environment tag
  mutate {
    add_field => { "environment" => "${ENV:production}" }
  }

  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "voidnull-logs-%{+YYYY.MM.dd}"
  }

  # Also log errors to stdout for debugging
  if [level] == "error" {
    stdout {
      codec => rubydebug
    }
  }
}
