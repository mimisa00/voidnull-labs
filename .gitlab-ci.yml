# GitLab CI — alternative to GitHub Actions
# Use if the original team hosts code on GitLab

stages:
  - test
  - build
  - deploy

variables:
  NODE_VERSION: "22"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# ── Cache node_modules ────────────────────────────────────────────────────────
.node_cache: &node_cache
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - apps/api/node_modules/
      - apps/web/node_modules/
      - packages/database/node_modules/

# ── Test ─────────────────────────────────────────────────────────────────────
lint:
  stage: test
  image: node:${NODE_VERSION}-alpine
  <<: *node_cache
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_USER: voidnull
        POSTGRES_PASSWORD: test_secret
        POSTGRES_DB: voidnull_test
    - name: redis:7-alpine
      alias: redis
  variables:
    DATABASE_URL: "postgresql://voidnull:test_secret@postgres:5432/voidnull_test"
    REDIS_URL: "redis://redis:6379"
    JWT_SECRET: "ci_jwt_secret_min_32_chars_long_x"
    JWT_REFRESH_SECRET: "ci_refresh_secret_32_chars_long"
    JWT_2FA_SECRET: "ci_2fa_secret_min_32_chars_long"
  script:
    - npm ci
    - cd packages/database && npx prisma generate && npx prisma migrate deploy
    - cd ../..
    - npm run lint
    - npm run test -- --passWithNoTests
  only:
    - merge_requests
    - main
    - staging
    - develop

# ── Build ─────────────────────────────────────────────────────────────────────
.build_image: &build_image
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

build_api:
  <<: *build_image
  script:
    - docker build -f apps/api/Dockerfile -t $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/api:latest
        docker push $CI_REGISTRY_IMAGE/api:latest
      fi
      if [ "$CI_COMMIT_BRANCH" = "staging" ]; then
        docker tag $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/api:staging
        docker push $CI_REGISTRY_IMAGE/api:staging
      fi
  only:
    - main
    - staging

build_web:
  <<: *build_image
  script:
    - docker build -f apps/web/Dockerfile -t $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/web:latest
        docker push $CI_REGISTRY_IMAGE/web:latest
      fi
      if [ "$CI_COMMIT_BRANCH" = "staging" ]; then
        docker tag $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/web:staging
        docker push $CI_REGISTRY_IMAGE/web:staging
      fi
  only:
    - main
    - staging

# ── Deploy ─────────────────────────────────────────────────────────────────────
deploy_staging:
  stage: deploy
  image: alpine:latest
  environment:
    name: staging
    url: https://staging.voidnull.io
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan $STAGING_HOST >> ~/.ssh/known_hosts
  script:
    - ssh $STAGING_USER@$STAGING_HOST "cd /opt/voidnull && docker compose -f infra/docker/compose.staging.yml pull && docker compose -f infra/docker/compose.staging.yml up -d"
  only:
    - staging
  needs: [build_api, build_web]

deploy_prod:
  stage: deploy
  image: alpine:latest
  environment:
    name: production
    url: https://voidnull.io
  when: manual  # Requires manual click in GitLab UI
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan $PROD_HOST >> ~/.ssh/known_hosts
  script:
    - ssh $PROD_USER@$PROD_HOST "cd /opt/voidnull && docker compose -f infra/docker/compose.prod.yml pull && docker compose -f infra/docker/compose.prod.yml up -d"
  only:
    - main
  needs: [build_api, build_web]
